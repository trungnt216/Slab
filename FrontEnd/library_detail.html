<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library- Management</title>
    <!-- css -->
    <link rel="stylesheet" href="styles.css" />
    <!-- icon-tab -->
    <link rel="icon" href="assets/icon/icon_tab.png" />
    <!-- font -->
    <script src="https://kit.fontawesome.com/f0add9272d.js"></script>
  </head>
  <body>
    <div class="container" id="li-index">
      <!-- header -->
      <div id="header-placeholder"></div>
      <!-- main -->
      <main>
        <!-- nav -->
        <nav class="note_f">
          <div class="logo">
            <h1>SaRLAB</h1>
          </div>
          <div class="menu">
            <a id="active" href="">Trang chủ</a>
            <a href="">Đăng xuất</a>
          </div>
        </nav>
        <!-- title -->
        <div class="title_li" id="list-title">
          <div class="f-li">
            <img id="li" src="assets/img/li.png" alt="" />
            <div class="des-li">
              <h1>-</h1>
              <h1>Khoa học xã hội và nhân văn</h1>
            </div>
          </div>
          <img src="assets/icon/icon_fly.png" alt="" />
        </div>
        <!-- detail -->
        <div class="form_detail" id="f-de">
          <!-- Embed PDF -->
          <embed
            id="pdf"
            src="/FrontEnd/assets/file/test.pdf"
            type="application/pdf"
          />
          <!-- conti -->
          <div class="conti">
            <img id="next_note" src="assets/icon/icon_next.png" alt="" />
          </div>
          <!-- note -->
          <div id="notification" class="note">
            <h1>NOTE</h1>
            <div class="text_note">
              <textarea
                id="noteInput"
                rows="5"
                cols="50"
                placeholder=".........................."
              ></textarea>
            </div>
            <div class="back">
              <img id="prev_note" src="assets/icon/icon_prev.png" alt="" />
            </div>
          </div>
        </div>
      </main>
    </div>
    <!-- scripts -->
    <script src="next.js"></script>
  </body>
</html>
