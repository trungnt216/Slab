<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.5" />
    <title>Login Form</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="container">
      <form class="login-form" id="loginForm" method="POST" action="your-login-endpoint">
        <h2>ĐĂNG NHẬP</h2>
        <div class="input-box">
          <input type="text" name="username" required />
          <label>Tên đăng nhập</label>
        </div>
        <div class="input-box">
          <input type="password" name="password" required />
          <label>Password</label>
        </div>

        <div class="message" id="loginMessage">
          <i>Vui lòng nhập thông tin</i>
        </div>
        
        <button class="login-btn" type="submit">Đăng nhập</button>
        <p>Bạn chưa có tài khoản? <a href="#">Đăng ký ngay</a></p>
      </form>
    </div>

    <div class="title-sar">
      <h1>SarLAB</h1>
    </div>
    <script src="login.js"></script>
  </body>
</html>
